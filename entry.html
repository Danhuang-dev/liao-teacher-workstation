<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廖老师的工作台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#f5f0ff 0%,#fff0f5 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .container{text-align:center;padding:40px 20px;max-width:400px}
  .logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#9B8EC4,#E8A0BF);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px;box-shadow:0 8px 24px rgba(155,142,196,0.3)}
  h1{font-size:24px;color:#333;margin-bottom:8px}
  p{font-size:14px;color:#666;margin-bottom:30px;line-height:1.6}
  .btn{display:inline-block;padding:14px 40px;background:linear-gradient(135deg,#9B8EC4,#E8A0BF);color:#fff;text-decoration:none;border-radius:12px;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(155,142,196,0.4);transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .version{margin-top:20px;font-size:12px;color:#999}
  .loading{display:none;margin-top:20px;font-size:14px;color:#9B8EC4}
</style>
</head>
<body>
<div class="container">
  <div class="logo">🐕</div>
  <h1>廖老师的工作台</h1>
  <p>高中生物教学助手<br>备课 · 学生管理 · 作业 · 错题本 · 智能助理蛋黄</p>
  <a href="https://aka.doubaocdn.com/s/ujnhOK1zsE" class="btn" id="enterBtn">进入工作台</a>
  <div class="loading" id="loading">正在跳转...</div>
  <div class="version">v26 · 最后更新 2026-09-13</div>
</div>
<script>
  // 3秒后自动跳转
  setTimeout(function(){
    document.getElementById('enterBtn').style.display='none';
    document.getElementById('loading').style.display='block';
    window.location.href='https://aka.doubaocdn.com/s/ujnhOK1zsE';
  },3000);
</script>
</body>
</html>
